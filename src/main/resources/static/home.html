<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - Library Management System</title>
<link
	href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
	rel="stylesheet">
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

:root {
	--primary-color: #2563eb;
	--primary-dark: #1e40af;
	--primary-light: #3b82f6;
	--danger-color: #ef4444;
	--success-color: #10b981;
	--text-dark: #0f172a;
	--text-gray: #64748b;
	--bg-light: #f8fafc;
	--white: #ffffff;
	--shadow-sm: 0 1px 2px 0 rgb(0 0 0/ 0.05);
	--shadow-md: 0 4px 6px -1px rgb(0 0 0/ 0.1);
	--shadow-lg: 0 10px 15px -3px rgb(0 0 0/ 0.1);
	--shadow-xl: 0 20px 25px -5px rgb(0 0 0/ 0.1);
}

body {
	font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
		sans-serif;
	color: var(--text-dark);
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

/* Header/Navbar */
.navbar {
	background: white;
	box-shadow: var(--shadow-md);
	padding: 0 40px;
	height: 70px;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

.logo {
	display: flex;
	align-items: center;
	gap: 12px;
	font-weight: 700;
	font-size: 1.3rem;
	color: var(--text-dark);
}

.logo-icon {
	width: 45px;
	height: 45px;
	background: linear-gradient(135deg, var(--primary-color),
		var(--primary-light));
	border-radius: 10px;
	display: flex;
	align-items: center;
	justify-content: center;
	box-shadow: var(--shadow-md);
}

.logo-icon svg {
	width: 26px;
	height: 26px;
	fill: white;
}

.user-menu {
	display: flex;
	align-items: center;
	gap: 20px;
}

.user-info {
	text-align: right;
}

.user-name {
	font-weight: 700;
	color: var(--text-dark);
	font-size: 1rem;
}

.user-email {
	font-size: 0.85rem;
	color: var(--text-gray);
}

.logout-btn {
	padding: 10px 24px;
	border-radius: 8px;
	border: 2px solid var(--danger-color);
	background: transparent;
	color: var(--danger-color);
	font-weight: 600;
	font-size: 0.95rem;
	cursor: pointer;
	transition: all 0.3s ease;
	font-family: 'Inter', sans-serif;
}

.logout-btn:hover {
	background: var(--danger-color);
	color: white;
}

/* Main Container */
.container {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 40px 20px;
}

.content-wrapper {
	max-width: 600px;
	width: 100%;
}

/* Welcome Card */
.welcome-card {
	background: white;
	border-radius: 16px;
	padding: 40px;
	box-shadow: var(--shadow-xl);
	margin-bottom: 30px;
	text-align: center;
}

.avatar {
	width: 100px;
	height: 100px;
	background: linear-gradient(135deg, var(--primary-color),
		var(--primary-light));
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	color: white;
	font-size: 2.5rem;
	font-weight: 700;
	margin: 0 auto 20px;
	box-shadow: var(--shadow-lg);
}

.welcome-card h1 {
	font-size: 2rem;
	font-weight: 800;
	color: var(--text-dark);
	margin-bottom: 10px;
}

.welcome-card p {
	font-size: 1rem;
	color: var(--text-gray);
}

/* Password Reset Card */
.password-card {
	background: white;
	border-radius: 16px;
	padding: 40px;
	box-shadow: var(--shadow-xl);
}

.card-header {
	margin-bottom: 30px;
	text-align: center;
}

.card-header h2 {
	font-size: 1.75rem;
	font-weight: 700;
	color: var(--text-dark);
	margin-bottom: 8px;
}

.card-header p {
	font-size: 0.95rem;
	color: var(--text-gray);
}

.form-group {
	margin-bottom: 25px;
}

.form-group label {
	display: block;
	font-weight: 600;
	font-size: 0.95rem;
	color: var(--text-dark);
	margin-bottom: 8px;
}

.form-group input {
	width: 100%;
	padding: 14px 16px;
	border: 2px solid #e2e8f0;
	border-radius: 10px;
	font-size: 0.95rem;
	font-family: 'Inter', sans-serif;
	transition: all 0.3s ease;
}

.form-group input:focus {
	outline: none;
	border-color: var(--primary-color);
	box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.form-group input::placeholder {
	color: #94a3b8;
}

.password-strength {
	margin-top: 8px;
	font-size: 0.85rem;
	color: var(--text-gray);
}

.btn-primary {
	width: 100%;
	padding: 14px 32px;
	border-radius: 10px;
	border: none;
	font-weight: 600;
	font-size: 1rem;
	cursor: pointer;
	transition: all 0.3s ease;
	font-family: 'Inter', sans-serif;
	background: linear-gradient(135deg, var(--primary-color),
		var(--primary-light));
	color: white;
	box-shadow: var(--shadow-md);
	margin-top: 10px;
}

.btn-primary:hover {
	transform: translateY(-2px);
	box-shadow: var(--shadow-lg);
}

.btn-primary:active {
	transform: translateY(0);
}

.response-message {
	margin-top: 20px;
	padding: 12px 16px;
	border-radius: 8px;
	font-size: 0.9rem;
	font-weight: 500;
	text-align: center;
	display: none;
}

.response-message.success {
	display: block;
	background-color: #d1fae5;
	color: #065f46;
	border: 1px solid var(--success-color);
}

.response-message.error {
	display: block;
	background-color: #fee2e2;
	color: #991b1b;
	border: 1px solid var(--danger-color);
}

/* Responsive */
@media ( max-width : 768px) {
	.navbar {
		padding: 0 20px;
	}
	.user-info {
		display: none;
	}
	.welcome-card, .password-card {
		padding: 30px 25px;
	}
	.welcome-card h1 {
		font-size: 1.6rem;
	}
	.avatar {
		width: 80px;
		height: 80px;
		font-size: 2rem;
	}
}
</style>
</head>
<body>

	<!-- Navigation Bar -->
	<nav class="navbar">
		<div class="logo">
			<div class="logo-icon">
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
						d="M4 6h2v12H4V6zm4 0h2v12H8V6zm4 0h2v12h-2V6zm4 0h2v12h-2V6zm4 0h2v12h-2V6z" />
        </svg>
			</div>
			<span>Library Management</span>
		</div>

		<div class="user-menu">
			<div class="user-info">
				<div class="user-name" id="userName">John Doe</div>
				<div class="user-email" id="userEmail">john.doe@example.com</div>
			</div>
			<button class="logout-btn" onclick="logout()">Logout</button>
		</div>
	</nav>

	<!-- Main Content -->
	<div class="container">
		<div class="content-wrapper">


			<!-- Password Reset Card -->
			<div class="password-card">
				<div class="card-header">
					<h2>Change Password</h2>
					<p>Keep your account secure by updating your password regularly</p>
				</div>

				<form id="passwordForm" onsubmit="changePassword(event)">

					<div class="form-group">
						<label for="newPassword">New Password</label> <input
							type="password" id="newPassword" name="newPassword"
							placeholder="Enter new password" required>
						<div class="password-strength" id="passwordStrength"></div>
					</div>

					<div class="form-group">
						<label for="confirmPassword">Confirm New Password</label> <input
							type="password" id="confirmPassword" name="confirmPassword"
							placeholder="Confirm your new password" required>
					</div>

					<button type="submit" class="btn-primary">Update Password</button>

					<div class="response-message" id="responseMessage"></div>
				</form>
			</div>

		</div>
	</div>
	<script>
document.addEventListener("DOMContentLoaded", () => {
  const email = localStorage.getItem("userEmail");
  const name = localStorage.getItem("userName");

  // If no session → redirect to login
  if (!email) {
    window.location.href = "login.html";
    return;
  }

  if (email) document.getElementById("userEmail").textContent = email;

  if (name) {
    document.getElementById("userName").textContent = name;
    const initials = name.split(" ").map(n => n[0]).join("").toUpperCase();
    const avatarEl = document.getElementById("userAvatar");
    if (avatarEl) avatarEl.textContent = initials;
  }
});

async function changePassword(event) {
  event.preventDefault();

  const newPassword = document.getElementById('newPassword').value.trim();
  const confirmPassword = document.getElementById('confirmPassword').value.trim();
  const responseMessage = document.getElementById('responseMessage');

  responseMessage.textContent = "";
  responseMessage.className = "response-message";

  // 1️⃣ Password match check
  if (newPassword !== confirmPassword) {
    responseMessage.classList.add("error");
    responseMessage.textContent = "New passwords do not match!";
    return;
  }

  // 2️⃣ Length validation
  if (newPassword.length < 8) {
    responseMessage.classList.add("error");
    responseMessage.textContent = "Password must be at least 8 characters long!";
    return;
  }

  try {
    const email = localStorage.getItem("userEmail");

    if (!email) {
      responseMessage.classList.add("error");
      responseMessage.textContent = "Session expired. Please login again.";
      setTimeout(() => window.location.href = "login.html", 1500);
      return;
    }

    // ✅ CORRECT REST API CALL
    const response = await fetch("http://localhost:8080/api/auth/change-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        newPassword: newPassword
      })
    });

    const result = await response.text();

    if (response.ok) {
      responseMessage.classList.add("success");
      responseMessage.textContent = "Password changed successfully! Redirecting to login...";

      document.getElementById('passwordForm').reset();
      document.getElementById('passwordStrength').textContent = '';

      // Clear session
      localStorage.clear();

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);

    } else {
      responseMessage.classList.add("error");
      responseMessage.textContent = result || "Failed to change password.";
    }

  } catch (error) {
    responseMessage.classList.add("error");
    responseMessage.textContent = "Network error. Please check your connection.";
  }
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
